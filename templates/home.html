<!--Cook-UP SITE-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Cook-Up</title>
    <style>
        html{
            height: 100%;
        }

        body{
            background-color: rgb(61, 61, 61);
            background-image: url("{{ url_for('static', filename='images/pexels-pixabay-326281.jpg') }}");
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        /*Main box*/
        .box {
            margin-left: auto;
            margin-right: auto;
            width: 1024px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            height: 118px;
            text-align: center;
            padding-top: 20px;
            position: relative;
        }

        header img{ /*Resizes logo in place */
            transform: scale(1.2);
            transform-origin: top;
        }

        nav{
            background-color: rgba(0, 0, 0, 0.267);
            text-align: center;
            padding-top: 14px;
            padding-bottom: 14px;
        }

        nav a {
            text-decoration: none;
            font-size: 17px;
            padding-left: 25px;
            padding-right: 25px;
            color: white;
        }

        main{
            flex: 1;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 0 240px;
        }

        h1{
            font-size: 84px;
            color: rgb(255, 255, 255);
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            margin: 0;
        }

        /*get stated button style*/
        main a{
            display: inline-block;
            background-color: rgb(102, 201, 9);
            padding: 15px 30px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            box-shadow: 0 2px 5px black;
            margin-top: 20px;
            transition: all 0.3s ease;
            color: white;
        }

        p {
            color: white;
            font-size: 18px;
            margin: 10px 0;
        }

        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }

        /*review box*/
        footer{
            background-color: greenyellow;
            height: 100px;
        }

        /*can add hover effects*/
        main a:hover {
            background-color: rgb(82, 161, 7);
            transform: translateY(-2px);
        }

        /*Logout button Feature*/
        .logout-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: rgba(255, 68, 68, 0.7); 
            color: white;
            padding: 8px 16px; 
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: all 0.3s ease;
            font-size: 14px; 
        }

        .logout-btn:hover {
            background-color: rgba(204, 0, 0, 0.7); 
            transform: translateY(-2px);
        }
    </style>
</head>
<!--MAIN BOX FOR HOME PAGE -->
<body>
    <div class="box">
        <header>
            <img src="{{ url_for('static', filename='images/Cook-Up Logo.png') }}" alt="Cook-Up Logo">
            <!--Logout button Feature-->
            {% if userName %}
            <a href="{{ url_for('logout') }}" class="logout-btn">LOGOUT</a>
            {% endif %}
        </header>

        <!--Top buttons --
        <nav>
            <a href= {{ url_for("home") }}>HOME</a>
            <a href= "#">RECIPES</a>
            <a href= "#">POST RECIPES</a>
            <a href= "#">FAVORITE</a>
            <a href= "#">CONTACT</a>
        </nav>  -->
        <nav>
            <span><a href = {{ url_for("search") }}>RECIPES</a><input type = "hidden" name = "searchInput" value = ""></span>
            <a href = {{ url_for("post_recipes") }}>POST RECIPES</a>
            <a href="{{ url_for('favorites', currentUserId = userId) }}">FAVORITES</a>
            <a href = {{ url_for("tempPage") }}>CONTACT</a>  
        </nav>

        
        
        <!--SOLVED In order to use links we need to use GET instead of POST while buttons need POST instead of GET-->
        <main>
            <h1>Cook-Up</h1>
            
            <!--How To Use The Values From The app.py in html / <p> form useful for displaying values to the user-->
            {% if userName %}
            <p>Welcome: {{ userName }}</p>
            {% endif %}
            
            <a href= {{ url_for("createAccount")}}>GET STARTED!</a>
            
            <!--How To Use The Values From The app.py in script form useful for using the values in script-->
            {% if userId %}
            <button onclick="myFunction()">Click me</button>
            {% endif %}
        </main>

        <!--Thinking of adding reviews or moving pictures of food maybe-->
        <footer></footer>
    </div>

    <script>
        function myFunction() 
        {
            alert("Hello: "+ "{{ userId }}")
        }
    </script>
</body>
</html>
